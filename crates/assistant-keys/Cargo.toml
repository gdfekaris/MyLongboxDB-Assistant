[package]
name = "assistant-keys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Argon2id derives the file's key from the passphrase; its working memory
# is wiped when done.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1.9.1"
getrandom = "0.4.3"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
