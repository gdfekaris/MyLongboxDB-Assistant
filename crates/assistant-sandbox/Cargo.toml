[package]
name = "assistant-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
libc = "0.2.190"
landlock = "0.4.7"
seccompiler = { version = "0.5.0", default-features = false }

[dev-dependencies]
assistant-core = { path = "../assistant-core", version = "0.1.0" }
assistant-keys = { path = "../assistant-keys", version = "0.1.0" }

# The file limits refuse to apply while other threads run, so these run
# as programs of their own, without the test runner's threads.
[[test]]
name = "landlock"
harness = false

[[test]]
name = "store_under_limits"
harness = false
