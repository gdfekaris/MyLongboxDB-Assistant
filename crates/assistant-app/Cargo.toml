[package]
name = "assistant-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mylongboxdb-assistant"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
adw = { package = "libadwaita", version = "0.9" }
gtk = { package = "gtk4", version = "0.11", features = ["gnome_49"] }
relm4 = { version = "0.11", default-features = false, features = ["macros", "libadwaita", "gnome_49"] }
