[package]
name = "assistant-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mylongboxdb-assistant"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
assistant-core = { path = "../assistant-core", version = "0.2.0" }
assistant-gcd = { path = "../assistant-gcd", version = "0.2.0" }
assistant-keys = { path = "../assistant-keys", version = "0.2.0" }
assistant-net = { path = "../assistant-net", version = "0.2.0" }
assistant-media = { path = "../assistant-media", version = "0.2.0" }
assistant-sandbox = { path = "../assistant-sandbox", version = "0.2.0" }
adw = { package = "libadwaita", version = "0.9" }
gtk = { package = "gtk4", version = "0.11", features = ["gnome_49"] }
relm4 = { version = "0.11", default-features = false, features = ["macros", "libadwaita", "gnome_49"] }

[features]
# Phone photos are often HEIC; the Flatpak builds libheif with its HEVC
# decoder and turns this on.
heic = ["assistant-media/heic"]
