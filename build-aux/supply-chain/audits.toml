
# cargo-vet audits file

[[audits.bytemuck]]
who = "gdfekaris <gdfekaris@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.22.0 -> 1.25.2"
notes = "New marker impls (arrays of NoUninit types, MaybeUninit arrays, fn pointers in Option) checked as sound; no new unsafe blocks."

[[audits.cfg-if]]
who = "gdfekaris <gdfekaris@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.0.4 -> 1.0.5"
notes = "Version bump, manifest reordering, doc and message text only; no code change."

[[audits.chacha20]]
who = "gdfekaris <gdfekaris@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.10.0 -> 0.10.2"
notes = "SSE2 backend no longer uses an SSE4.1 intrinsic (unaligned store of row 3 instead, in bounds); NEON batching in bounds; no new capabilities."

[[audits.fastrand]]
who = "gdfekaris <gdfekaris@gmail.com>"
criteria = "safe-to-deploy"
delta = "2.3.0 -> 2.5.0"
notes = "New float sampling in safe code; getrandom bump applies only to wasm32 with the js feature."

