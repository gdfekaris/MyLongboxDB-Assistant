# The app never runs external programs, whether through std or through
# GLib/GIO, and never hands files or URIs off to other applications. Its
# only connections are the HTTP client's, made with settings the app
# chooses rather than ureq's defaults.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "the app must not run external programs" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "the app must not run external programs" },
    { path = "glib::spawn_async", reason = "the app must not run external programs", allow-invalid = true },
    { path = "glib::spawn_async_with_fds", reason = "the app must not run external programs", allow-invalid = true },
    { path = "glib::spawn_async_with_pipes", reason = "the app must not run external programs", allow-invalid = true },
    { path = "glib::spawn_command_line_async", reason = "the app must not run external programs", allow-invalid = true },
    { path = "gio::AppInfo::create_from_commandline", reason = "the app must not run external programs", allow-invalid = true },
    { path = "gio::AppInfo::launch_default_for_uri", reason = "the app must not hand off to other applications", allow-invalid = true },
    { path = "gio::AppInfo::launch_default_for_uri_async", reason = "the app must not hand off to other applications", allow-invalid = true },
    { path = "gio::AppInfo::launch_default_for_uri_future", reason = "the app must not hand off to other applications", allow-invalid = true },
    { path = "gio::prelude::AppInfoExt::launch", reason = "the app must not run external programs", allow-invalid = true },
    { path = "gio::prelude::AppInfoExt::launch_uris", reason = "the app must not hand off to other applications", allow-invalid = true },
    { path = "gio::prelude::AppInfoExtManual::launch_uris_async", reason = "the app must not hand off to other applications", allow-invalid = true },
    { path = "gio::prelude::AppInfoExtManual::launch_uris_future", reason = "the app must not hand off to other applications", allow-invalid = true },
    { path = "gtk4::show_uri", reason = "the app must not hand off to other applications", allow-invalid = true },
    { path = "gtk4::show_uri_full", reason = "the app must not hand off to other applications", allow-invalid = true },
    { path = "gtk4::show_uri_full_future", reason = "the app must not hand off to other applications", allow-invalid = true },
    { path = "ureq::get", reason = "uses ureq's default settings, which follow redirects and read proxies from the environment", allow-invalid = true },
    { path = "ureq::post", reason = "uses ureq's default settings, which follow redirects and read proxies from the environment", allow-invalid = true },
    { path = "ureq::put", reason = "uses ureq's default settings, which follow redirects and read proxies from the environment", allow-invalid = true },
    { path = "ureq::delete", reason = "uses ureq's default settings, which follow redirects and read proxies from the environment", allow-invalid = true },
    { path = "ureq::head", reason = "uses ureq's default settings, which follow redirects and read proxies from the environment", allow-invalid = true },
    { path = "ureq::patch", reason = "uses ureq's default settings, which follow redirects and read proxies from the environment", allow-invalid = true },
    { path = "ureq::options", reason = "uses ureq's default settings, which follow redirects and read proxies from the environment", allow-invalid = true },
    { path = "ureq::trace", reason = "uses ureq's default settings, which follow redirects and read proxies from the environment", allow-invalid = true },
    { path = "ureq::connect", reason = "uses ureq's default settings, which follow redirects and read proxies from the environment", allow-invalid = true },
    { path = "ureq::agent", reason = "uses ureq's default settings, which follow redirects and read proxies from the environment", allow-invalid = true },
    { path = "ureq::run", reason = "uses ureq's default settings, which follow redirects and read proxies from the environment", allow-invalid = true },
    { path = "ureq::Agent::new_with_defaults", reason = "uses ureq's default settings, which follow redirects and read proxies from the environment", allow-invalid = true },
    # The sandbox crate may call libc, the one crate allowed unsafe code.
    { path = "libc::execv", reason = "the app must not run external programs", allow-invalid = true },
    { path = "libc::execve", reason = "the app must not run external programs", allow-invalid = true },
    { path = "libc::execvp", reason = "the app must not run external programs", allow-invalid = true },
    { path = "libc::execvpe", reason = "the app must not run external programs", allow-invalid = true },
    { path = "libc::execl", reason = "the app must not run external programs", allow-invalid = true },
    { path = "libc::execle", reason = "the app must not run external programs", allow-invalid = true },
    { path = "libc::execlp", reason = "the app must not run external programs", allow-invalid = true },
    { path = "libc::fexecve", reason = "the app must not run external programs", allow-invalid = true },
    { path = "libc::execveat", reason = "the app must not run external programs", allow-invalid = true },
    { path = "libc::system", reason = "the app must not run external programs", allow-invalid = true },
    { path = "libc::popen", reason = "the app must not run external programs", allow-invalid = true },
    { path = "libc::posix_spawn", reason = "the app must not run external programs", allow-invalid = true },
    { path = "libc::posix_spawnp", reason = "the app must not run external programs", allow-invalid = true },
]
disallowed-types = [
    { path = "std::process::Command", reason = "the app must not run external programs" },
    { path = "std::process::Child", reason = "the app must not run external programs" },
    { path = "gio::Subprocess", reason = "the app must not run external programs", allow-invalid = true },
    { path = "gio::SubprocessLauncher", reason = "the app must not run external programs", allow-invalid = true },
    { path = "gio::DesktopAppInfo", reason = "the app must not run external programs", allow-invalid = true },
    { path = "gtk4::UriLauncher", reason = "the app must not hand off to other applications", allow-invalid = true },
    { path = "gtk4::FileLauncher", reason = "the app must not hand off to other applications", allow-invalid = true },
    { path = "std::net::TcpStream", reason = "connections go only through the HTTP client, which checks the host" },
    { path = "std::net::TcpListener", reason = "the app never listens for connections" },
    { path = "std::net::UdpSocket", reason = "connections go only through the HTTP client, which checks the host" },
]
