[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/gdfekaris/MyLongboxDB-Assistant"
publish = false

[workspace.lints.clippy]
# Running other programs, raw sockets, and ureq's default settings are
# banned; the paths live in clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"

# Arithmetic that overflows stops the app rather than wrapping into a
# wrong size or index, as it does in development builds. Provider
# responses and picked photos reach code that counts bytes and pixels.
[profile.release]
overflow-checks = true

# cargo-vet's audit records live with the other build files.
[workspace.metadata.vet]
store = { path = "./build-aux/supply-chain" }
